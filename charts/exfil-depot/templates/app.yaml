apiVersion: v1
kind: Service
metadata:
  name: {{ include "exfil-depot.fullname" . }}
  labels:
    {{- include "exfil-depot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: {{ include "exfil-depot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exfil-depot.fullname" . }}
  labels:
    {{- include "exfil-depot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "exfil-depot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "exfil-depot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "exfil-depot.dbSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "exfil-depot.dbSecretName" . }}
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "exfil-depot.dbSecretName" . }}
                  key: database
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@{{ include "exfil-depot.fullname" . }}-db:5432/$(DB_NAME)"
            - name: FORGE_DATA
              value: /data/forge
            - name: FORCE_REIMPORT
              value: {{ .Values.forceReimport | ternary "1" "0" | quote }}
          ports:
            - containerPort: 8000
          # the container imports the catalogue before serving; allow generous startup
          startupProbe:
            httpGet:
              path: /api/stats
              port: 8000
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /api/stats
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: forge-data
              mountPath: /data/forge
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: forge-data
          {{- if .Values.forgeData.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.forgeData.existingClaim }}
          {{- else if .Values.forgeData.hostPath }}
          hostPath:
            path: {{ .Values.forgeData.hostPath }}
            type: Directory
          {{- else }}
          # no archive configured - the app starts with an empty catalogue
          emptyDir: {}
          {{- end }}
